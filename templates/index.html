<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft</title><link rel="stylesheet" href="/static/style.css"></head><body><main><div class="brand">✦ COMICCRAFT</div><h1>Turn an idea into a comic.</h1><p>Create a 5-panel AI comic with Gemini.</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post" action="/generate"><label>Story Prompt<textarea name="prompt" required>A brave fox discovers a magical portal in an enchanted forest.</textarea></label><div class="grid"><label>Character<input name="character_name" value="Fenn" required></label><label>Setting<input name="setting" value="Enchanted forest" required></label><label>Tone<input name="tone" value="Adventurous" required></label><label>Art Style<input name="art_style" value="Comic book" required></label></div><button>Create My Comic ✨</button></form></main></body></html>
